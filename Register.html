<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="bg-slate-100 min-h-screen w-full bg-cover bg-center bg-fixed"
    style="
      background-image: url(&quot;https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=2000&q=80&quot;);
    "
  >
    <nav
      class="relative z-10 bg-teal-700/95 text-white px-5 sm:px-8 py-4 flex items-center justify-between shadow-lg"
    >
      <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">
        <a href="start.html">Shop-with-me</a>
      </h1>

      <div class="hidden md:flex gap-5 lg:gap-8 text-base lg:text-lg">
        <a href="login.html" class="hover:text-teal-200 transition"> Home </a>

        <a href="login.html" class="hover:text-teal-200 transition">
          Furniture
        </a>

        <a href="login.html" class="hover:text-teal-200 transition"> About </a>

        <a href="login.html" class="hover:text-teal-200 transition">
          Contact
        </a>
      </div>

      <div class="hidden sm:flex gap-2 sm:gap-3">
        <a
          href="login.html"
          class="px-3 sm:px-5 py-2 rounded-lg border border-white hover:bg-white hover:text-teal-700 transition text-sm sm:text-base"
        >
          Login
        </a>

        <a
          href="register.html"
          class="px-3 sm:px-5 py-2 rounded-lg bg-white text-teal-700 font-semibold hover:bg-teal-100 transition text-sm sm:text-base"
        >
          Register
        </a>
      </div>

      <button onclick="showMenu()" class="sm:hidden text-3xl">
        <i class="ri-menu-line"></i>
      </button>
    </nav>

    <div
      id="mobileMenu"
      class="hidden sm:hidden bg-teal-700 text-white px-6 py-5 relative z-20"
    >
      <div class="flex flex-col gap-4 text-lg">
        <a href="login.html" class="hover:text-teal-200"> Home </a>

        <a href="login.html" class="hover:text-teal-200"> Furniture </a>

        <a href="login.html" class="hover:text-teal-200"> About </a>

        <a href="login.html" class="hover:text-teal-200"> Contact </a>

        <div class="flex gap-3 pt-2">
          <a href="login.html" class="px-4 py-2 rounded-lg border border-white">
            Login
          </a>

          <a
            href="register.html"
            class="px-4 py-2 rounded-lg bg-white text-teal-700 font-semibold"
          >
            Register
          </a>
        </div>
      </div>
    </div>

    <div class="flex justify-center items-center px-4 sm:px-6 py-10 sm:py-16">
      <div
        class="bg-white shadow-md shadow-black/50 p-5 sm:p-7 border rounded-md w-full max-w-3xl"
      >
        <h1
          class="text-3xl sm:text-4xl text-shadow-sm shadow-black/50 font-bold text-center text-emerald-800"
        >
          Register
        </h1>

        <div
          class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-7 text-base sm:text-lg font-semibold mt-8 sm:mt-10"
        >
          <div class="flex flex-col">
            <h1>Full Name</h1>

            <input
              class="Name mt-1 border shadow-sm shadow-black/50 py-2 px-3 text-base border-black rounded-sm w-full"
              type="text"
              name="name"
              placeholder="Enter your name"
            />
          </div>

          <div class="flex flex-col">
            <h1>Username</h1>

            <input
              class="UserName mt-1 border shadow-sm shadow-black/50 py-2 px-3 text-base border-black rounded-sm w-full"
              type="text"
              name="username"
              placeholder="Enter your username"
            />
          </div>

          <div class="flex flex-col">
            <h1>Email</h1>

            <input
              class="Email mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-base border-black rounded-sm w-full"
              type="email"
              name="email"
              placeholder="Enter your email"
            />
          </div>

          <div class="flex flex-col">
            <h1>Password</h1>

            <input
              class="Password mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-base border-black rounded-sm w-full"
              type="password"
              name="password"
              placeholder="Enter your password"
            />
          </div>

          <div class="flex flex-col">
            <label for="gender-select"> Gender </label>

            <select
              id="gender-select"
              name="gender"
              class="Gender mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-black/90 text-base border-black rounded-sm w-full"
            >
              <option value="" disabled selected>Select your gender</option>

              <option value="male">Male</option>

              <option value="female">Female</option>
            </select>
          </div>

          <div class="flex flex-col">
            <h1>Phone Number</h1>

            <input
              class="Number mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-base border-black rounded-sm w-full"
              type="tel"
              name="number"
              placeholder="Mobile number"
            />
          </div>
        </div>

        <div class="flex flex-col justify-center">
          <button
            onclick="AddUser()"
            class="bg-teal-600 hover:bg-teal-700 shadow-sm shadow-black/50 w-full py-2 px-5 mt-8 sm:mt-10 text-lg sm:text-xl border border-black font-semibold text-white rounded-xl transition"
          >
            Register
          </button>

          <h1 class="mt-3 text-sm sm:text-base text-black/60">
            Already have an account?

            <span class="text-blue-600/70">
              <a href="login.html"> Login. </a>
            </span>
          </h1>
        </div>
      </div>
    </div>

    <script>
      function showMenu() {
        let menu = document.querySelector("#mobileMenu");

        menu.classList.toggle("hidden");
      }

      let inp = document.querySelectorAll("input");

      let inpname = document.querySelector(".Name");

      let inpusername = document.querySelector(".UserName");

      let inpemail = document.querySelector(".Email");

      let inppassword = document.querySelector(".Password");

      let inpgender = document.querySelector(".Gender");

      let inpnumber = document.querySelector(".Number");

      let Userdata = JSON.parse(localStorage.getItem("users")) || [];

      let doesexists = true;

      function AddUser() {
        Userdata.push({
          FullName: inpname.value,

          Username: inpusername.value,

          Email: inpemail.value,

          Password: inppassword.value,

          Gender: inpgender.value,

          PhoneNumber: inpnumber.value,
        });

        localStorage.setItem("users", JSON.stringify(Userdata));

        alert("Registration successful!");

        inpname.value = "";

        inpusername.value = "";

        inpemail.value = "";

        inppassword.value = "";

        inpgender.value = "";

        inpnumber.value = "";
      }
    </script>
  </body>
</html>
