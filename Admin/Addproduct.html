<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-slate-100 min-h-screen w-full">
    <div class="bg-teal-900">
      <div
        class="py-5 px-5 sm:px-8 lg:px-25 flex justify-between items-center text-white"
      >
        <h1 class="text-2xl sm:text-3xl font-bold">Admin</h1>

        <div class="flex gap-4 sm:gap-8 lg:gap-10 items-center">
          <button id="menuBtn" class="text-2xl lg:hidden">
            <i class="ri-menu-fill"></i>
          </button>

          <ul
            class="hidden lg:flex gap-10 xl:gap-15 text-white/75 text-md font-bold"
          >
            <li><a href="orders.html">Orders</a></li>
            <li><a href="Users.html">Users</a></li>
            <li><a href="products.html">Product</a></li>
            <li><a href="Addproduct.html">Add Products</a></li>
          </ul>

          <button
            onclick="logout()"
            class="hidden sm:block bg-white text-teal-900 px-4 py-2 rounded-full font-semibold"
          >
            Logout
          </button>
        </div>
      </div>

      <div id="mobileNav" class="hidden lg:hidden px-5 pb-5">
        <ul
          class="flex flex-col gap-4 border-t border-white/20 pt-4 text-white/80 font-semibold"
        >
          <li><a href="orders.html">Orders</a></li>
          <li><a href="Users.html">Users</a></li>
          <li><a href="products.html">Product</a></li>
          <li><a href="Addproduct.html">Add Products</a></li>
          <li>
            <button
              onclick="logout()"
              class="bg-white text-teal-900 px-4 py-2 rounded-full"
            >
              Logout
            </button>
          </li>
        </ul>
      </div>
    </div>

    <div
      class="bg-white shadow-md shadow-black/30 p-5 sm:p-7 border rounded-md w-[94%] sm:w-[90%] lg:w-[70%] xl:w-[60%] mx-auto mt-5"
    >
      <h1 class="text-3xl sm:text-4xl font-bold text-center text-emerald-800">
        Add Product
      </h1>

      <div
        class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-7 text-base sm:text-lg font-semibold mt-8"
      >
        <div class="flex flex-col">
          <h1>Product Name</h1>
          <input
            class="product mt-1 border shadow-sm shadow-black/50 py-2 px-3 text-base border-black rounded-sm"
            type="text"
            placeholder="Enter Product name"
          />
        </div>

        <div class="flex flex-col">
          <h1>Price</h1>
          <input
            class="InputPrice mt-1 border shadow-sm shadow-black/50 py-2 px-3 text-base border-black rounded-sm"
            type="number"
            placeholder="Enter price"
          />
        </div>

        <div class="flex flex-col">
          <h1>Product Category</h1>
          <input
            class="InputCatogary mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-base border-black rounded-sm"
            type="text"
            placeholder="Enter Category"
          />
        </div>

        <div class="flex flex-col">
          <h1>Image</h1>
          <input
            class="InputImage mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-base border-black rounded-sm"
            type="text"
            placeholder="Enter image URL"
          />
        </div>

        <div class="flex flex-col">
          <h1>Description</h1>
          <input
            class="InputDescription mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-base border-black rounded-sm"
            type="text"
            placeholder="Enter description"
          />
        </div>

        <div class="flex flex-col">
          <h1>Stocks</h1>
          <input
            class="Inputstock mt-1 shadow-sm shadow-black/50 border py-2 px-3 text-base border-black rounded-sm"
            type="number"
            placeholder="Enter the stock left"
          />
        </div>
      </div>

      <button
        onclick="Addproduct()"
        class="bg-teal-600 shadow-sm shadow-black/50 w-full py-2 px-5 mt-8 text-lg sm:text-xl border border-black font-semibold text-white rounded-xl"
      >
        Add Product
      </button>
    </div>

    <script>
      let inpproduct = document.querySelector(".product");
      let inpprice = document.querySelector(".InputPrice");
      let inpcategary = document.querySelector(".InputCatogary");
      let inpimage = document.querySelector(".InputImage");
      let inpdescription = document.querySelector(".InputDescription");
      let inpstock = document.querySelector(".Inputstock");

      let ProductData = JSON.parse(localStorage.getItem("products")) || [];

      function Addproduct() {
        ProductData.push({
          Product: inpproduct.value,
          Price: inpprice.value,
          Catogary: inpcategary.value,
          Image: inpimage.value,
          Description: inpdescription.value,
          Stock: inpstock.value,
        });

        localStorage.setItem("products", JSON.stringify(ProductData));

        alert("Product added successfully");

        inpproduct.value = "";
        inpprice.value = "";
        inpcategary.value = "";
        inpimage.value = "";
        inpdescription.value = "";
        inpstock.value = "";
      }

      let menuBtn = document.querySelector("#menuBtn");
      let mobileNav = document.querySelector("#mobileNav");

      menuBtn.addEventListener("click", function () {
        mobileNav.classList.toggle("hidden");
      });

      function logout() {
        localStorage.removeItem("userIndex");
        window.location.href = "../login.html";
      }
    </script>
  </body>
</html>
