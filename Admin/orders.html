<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-gray-100">
    <section>
      <div
        class="bg-teal-700 py-5 sm:py-7 px-5 sm:px-8 lg:px-25 flex justify-between items-center text-white"
      >
        <h1 class="text-2xl sm:text-3xl font-bold">Admin</h1>

        <div class="flex gap-4 sm:gap-8 lg:gap-10 items-center">
          <button id="menuBtn" class="text-2xl lg:hidden">
            <i class="ri-menu-fill"></i>
          </button>

          <ul
            class="hidden lg:flex gap-10 xl:gap-15 text-white/75 text-md font-bold"
          >
            <li><a href="orders.html">Orders</a></li>
            <li><a href="Users.html">Users</a></li>
            <li><a href="products.html">Product</a></li>
            <li><a href="Addproduct.html">Add Products</a></li>
          </ul>

          <button
            onclick="logout()"
            class="hidden sm:block bg-white text-teal-900 px-4 py-2 rounded-full font-semibold"
          >
            Logout
          </button>
        </div>
      </div>

      <div id="mobileNav" class="hidden lg:hidden bg-teal-700 px-5 pb-5">
        <ul
          class="flex flex-col gap-4 border-t border-white/20 pt-4 text-white/80 font-semibold"
        >
          <li><a href="orders.html">Orders</a></li>
          <li><a href="Users.html">Users</a></li>
          <li><a href="products.html">Product</a></li>
          <li><a href="Addproduct.html">Add Products</a></li>

          <li>
            <button
              onclick="logout()"
              class="bg-white text-teal-900 px-4 py-2 rounded-full"
            >
              Logout
            </button>
          </li>
        </ul>
      </div>
    </section>

    <section class="px-4 sm:px-6 lg:px-10 py-6 sm:py-10">
      <h1 class="text-2xl sm:text-3xl font-bold mb-5 sm:mb-6">Orders</h1>

      <div id="editBox" class="hidden mb-5 bg-white p-4 rounded shadow">
        <div class="flex flex-col sm:flex-row gap-2">
          <input
            type="text"
            id="statusInput"
            class="border border-gray-400 px-3 py-2 rounded w-full sm:w-auto"
            placeholder="Enter status"
          />

          <button
            onclick="saveStatus()"
            class="bg-green-600 text-white px-4 py-2 rounded"
          >
            Save
          </button>

          <button
            onclick="cancelEdit()"
            class="bg-gray-500 text-white px-4 py-2 rounded"
          >
            Cancel
          </button>
        </div>
      </div>

      <div class="overflow-x-auto bg-white">
        <table
          class="min-w-[1400px] w-full border-collapse border border-black text-left"
        >
          <thead class="bg-teal-700 text-white">
            <tr>
              <th class="border border-black px-4 py-3">Customer ID</th>
              <th class="border border-black px-4 py-3">Name</th>
              <th class="border border-black px-4 py-3">Email</th>
              <th class="border border-black px-4 py-3">Phone</th>
              <th class="border border-black px-4 py-3">Address</th>
              <th class="border border-black px-4 py-3">Pincode</th>
              <th class="border border-black px-4 py-3">City</th>
              <th class="border border-black px-4 py-3">State</th>
              <th class="border border-black px-4 py-3">Product</th>
              <th class="border border-black px-4 py-3">Price</th>
              <th class="border border-black px-4 py-3">Status</th>
              <th class="border border-black px-4 py-3">Action</th>
            </tr>
          </thead>

          <tbody id="usertable"></tbody>
        </table>
      </div>
    </section>

    <script>
      let userTable = document.querySelector("#usertable");

      let users = JSON.parse(localStorage.getItem("order")) || [];

      let editIndex = null;
      let editProductIndex = null;

      let menuBtn = document.querySelector("#menuBtn");
      let mobileNav = document.querySelector("#mobileNav");

      menuBtn.addEventListener("click", function () {
        mobileNav.classList.toggle("hidden");
      });

      function show() {
        userTable.innerHTML = "";

        for (let i = 0; i < users.length; i++) {
          let user = users[i];
          let products = user.products || [];

          for (let k = 0; k < products.length; k++) {
            let product = products[k];

            if (!product.status) {
              product.status = "Pending";
            }

            userTable.innerHTML += `
                        <tr class="hover:bg-slate-100">

                            <td class="border border-black px-4 py-3">
                                ${user.customerId || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${user.name || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${user.email || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${user.phone || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${user.address || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${user.pincode || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${user.city || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${user.state || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${product.Product || ""}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ₹${product.Price || 0}
                            </td>

                            <td class="border border-black px-4 py-3">
                                ${product.status}
                            </td>

                            <td class="border border-black px-4 py-3">

                                <button onclick="editOrder(${i},${k})"
                                    class="bg-blue-600 text-white px-3 py-2 rounded">
                                    Edit
                                </button>

                                <button onclick="DeleteOrder(${i},${k})"
                                    class="bg-red-600 text-white px-3 py-2 rounded mt-2">
                                    Delete
                                </button>

                            </td>

                        </tr>
                    `;
          }
        }

        localStorage.setItem("order", JSON.stringify(users));
      }

      function editOrder(i, k) {
        editIndex = i;

        editProductIndex = k;

        let currentStatus = users[i].products[k].status;

        document.querySelector("#statusInput").value = currentStatus;

        document.querySelector("#editBox").classList.remove("hidden");
      }

      function saveStatus() {
        let newStatus = document.querySelector("#statusInput").value;

        if (newStatus == "") {
          alert("Enter status");
          return;
        }

        users[editIndex].products[editProductIndex].status = newStatus;

        localStorage.setItem("order", JSON.stringify(users));

        document.querySelector("#editBox").classList.add("hidden");

        editIndex = null;
        editProductIndex = null;

        show();
      }

      function cancelEdit() {
        document.querySelector("#editBox").classList.add("hidden");

        editIndex = null;
        editProductIndex = null;
      }

      function DeleteOrder(i, k) {
        users[i].products.splice(k, 1);

        if (users[i].products.length == 0) {
          users.splice(i, 1);
        }

        localStorage.setItem("order", JSON.stringify(users));

        show();
      }

      function logout() {
        localStorage.removeItem("userIndex");

        window.location.href = "login.html";
      }

      show();
    </script>
  </body>
</html>
