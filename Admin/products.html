<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-slate-100 min-h-screen">
    <div class="bg-teal-900">
      <div
        class="py-5 sm:py-7 px-5 sm:px-8 lg:px-25 flex justify-between items-center text-white"
      >
        <h1 class="text-2xl sm:text-3xl font-bold">Admin</h1>

        <div class="flex gap-4 sm:gap-8 lg:gap-10 items-center">
          <button id="menuBtn" class="text-2xl lg:hidden">
            <i class="ri-menu-fill"></i>
          </button>

          <ul
            class="hidden lg:flex gap-10 xl:gap-15 text-white/75 text-md font-bold"
          >
            <li><a href="orders.html">Orders</a></li>
            <li><a href="Users.html">Users</a></li>
            <li><a href="products.html">Product</a></li>
            <li><a href="Addproduct.html">Add Products</a></li>
          </ul>

          <button
            onclick="logout()"
            class="hidden sm:block bg-white text-teal-900 px-4 py-2 rounded-full font-semibold"
          >
            Logout
          </button>
        </div>
      </div>

      <div id="mobileNav" class="hidden lg:hidden px-5 pb-5">
        <ul
          class="flex flex-col gap-4 border-t border-white/20 pt-4 text-white/80 font-semibold"
        >
          <li><a href="orders.html">Orders</a></li>
          <li><a href="Users.html">Users</a></li>
          <li><a href="products.html">Product</a></li>
          <li><a href="Addproduct.html">Add Products</a></li>

          <li>
            <button
              onclick="logout()"
              class="bg-white text-teal-900 px-4 py-2 rounded-full"
            >
              Logout
            </button>
          </li>
        </ul>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <div class="bg-white border border-black rounded-md shadow-md p-4 sm:p-6">
        <div
          class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2"
        >
          <h1 class="text-2xl sm:text-3xl font-bold text-emerald-800">
            Admin Panel
          </h1>

          <h2 class="text-lg sm:text-xl font-semibold">Products</h2>
        </div>

        <div
          id="editBox"
          class="border border-black rounded-md p-4 sm:p-5 mt-6 sm:mt-8 hidden"
        >
          <h2 class="text-xl sm:text-2xl font-bold text-emerald-800 mb-5">
            Edit Product
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
            <div>
              <label class="font-semibold"> Product Name </label>

              <input
                id="editProduct"
                type="text"
                class="w-full border border-black rounded-md px-3 py-2 mt-1"
              />
            </div>

            <div>
              <label class="font-semibold"> Price </label>

              <input
                id="editPrice"
                type="text"
                class="w-full border border-black rounded-md px-3 py-2 mt-1"
              />
            </div>

            <div>
              <label class="font-semibold"> Category </label>

              <input
                id="editCategory"
                type="text"
                class="w-full border border-black rounded-md px-3 py-2 mt-1"
              />
            </div>

            <div>
              <label class="font-semibold"> Stock </label>

              <input
                id="editStock"
                type="text"
                class="w-full border border-black rounded-md px-3 py-2 mt-1"
              />
            </div>

            <div class="md:col-span-2">
              <label class="font-semibold"> Image </label>

              <input
                id="editImage"
                type="text"
                class="w-full border border-black rounded-md px-3 py-2 mt-1"
              />
            </div>

            <div class="md:col-span-2">
              <label class="font-semibold"> Description </label>

              <textarea
                id="editDescription"
                class="w-full border border-black rounded-md px-3 py-2 mt-1"
              ></textarea>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-3 mt-5">
            <button
              onclick="UpdateProduct()"
              class="bg-emerald-700 text-white px-5 py-2 rounded-md"
            >
              Update Product
            </button>

            <button
              onclick="CancelEdit()"
              class="bg-gray-500 text-white px-5 py-2 rounded-md"
            >
              Cancel
            </button>
          </div>
        </div>

        <div class="overflow-x-auto mt-6 sm:mt-8">
          <table
            class="min-w-[1000px] w-full border-collapse border border-black text-left"
          >
            <thead>
              <tr class="bg-emerald-700 text-white">
                <th class="border border-black px-4 py-3">#</th>

                <th class="border border-black px-4 py-3">Product Name</th>

                <th class="border border-black px-4 py-3">Price</th>

                <th class="border border-black px-4 py-3">Category</th>

                <th class="border border-black px-4 py-3">Description</th>

                <th class="border border-black px-4 py-3">Stock</th>

                <th class="border border-black px-4 py-3">Action</th>
              </tr>
            </thead>

            <tbody id="productTable"></tbody>
          </table>
        </div>

        <h2
          id="noProduct"
          class="text-center text-gray-500 text-lg sm:text-xl mt-8 hidden"
        >
          No product registered yet.
        </h2>
      </div>
    </div>

    <script>
      let Product = JSON.parse(localStorage.getItem("products")) || [];

      let productTable = document.querySelector("#productTable");
      let noProduct = document.querySelector("#noProduct");

      let editBox = document.querySelector("#editBox");
      let editProduct = document.querySelector("#editProduct");
      let editPrice = document.querySelector("#editPrice");
      let editCategory = document.querySelector("#editCategory");
      let editStock = document.querySelector("#editStock");
      let editImage = document.querySelector("#editImage");
      let editDescription = document.querySelector("#editDescription");

      let editIndex;

      let menuBtn = document.querySelector("#menuBtn");
      let mobileNav = document.querySelector("#mobileNav");

      menuBtn.addEventListener("click", function () {
        mobileNav.classList.toggle("hidden");
      });

      function ShowProducts() {
        productTable.innerHTML = "";

        if (Product.length === 0) {
          noProduct.classList.remove("hidden");

          return;
        }

        noProduct.classList.add("hidden");

        Product.forEach(function (product, index) {
          productTable.innerHTML += `

                    <tr class="hover:bg-slate-100">

                        <td class="border border-black px-4 py-3">
                            ${index + 1}
                        </td>

                        <td class="border border-black px-4 py-3">
                            ${product.Product}
                        </td>

                        <td class="border border-black px-4 py-3">
                            ${product.Price}
                        </td>

                        <td class="border border-black px-4 py-3">
                            ${product.Catogary}
                        </td>

                        <td class="border border-black px-4 py-3">
                            ${product.Description}
                        </td>

                        <td class="border border-black px-4 py-3">
                            ${product.Stock}
                        </td>

                        <td class="border border-black px-4 py-3">

                            <button onclick="EditProduct(${index})"
                                class="bg-blue-600 text-white px-4 py-1 rounded-md">
                                Edit
                            </button>

                            <button onclick="DeleteProduct(${index})"
                                class="bg-red-600 text-white px-4 py-1 rounded-md ml-2">
                                Delete
                            </button>

                        </td>

                    </tr>

                `;
        });
      }

      function EditProduct(index) {
        editIndex = index;

        let product = Product[index];

        editProduct.value = product.Product;
        editPrice.value = product.Price;
        editCategory.value = product.Catogary;
        editStock.value = product.Stock;
        editImage.value = product.Image;
        editDescription.value = product.Description;

        editBox.classList.remove("hidden");
      }

      function UpdateProduct() {
        Product[editIndex].Product = editProduct.value;
        Product[editIndex].Price = editPrice.value;
        Product[editIndex].Catogary = editCategory.value;
        Product[editIndex].Stock = editStock.value;
        Product[editIndex].Image = editImage.value;
        Product[editIndex].Description = editDescription.value;

        localStorage.setItem("products", JSON.stringify(Product));

        ShowProducts();

        editBox.classList.add("hidden");

        alert("Product updated successfully!");
      }

      function CancelEdit() {
        editBox.classList.add("hidden");
      }

      function DeleteProduct(index) {
        Product.splice(index, 1);

        localStorage.setItem("products", JSON.stringify(Product));

        ShowProducts();
      }

      function logout() {
        localStorage.removeItem("userIndex");

        window.location.href = "../login.html";
      }

      ShowProducts();
    </script>
  </body>
</html>
